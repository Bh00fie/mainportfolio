    <!-- Declared before the script below, which updates it. Querying it from a
         script placed above this tag returns null. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Applied before first paint so dark-mode visitors never see a white flash.
         Keep this inline and keep it here; moving it into React reintroduces the flash. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = stored || (prefersDark ? 'dark' : 'light');
        } catch (e) {
          // localStorage can throw in private browsing; fall back to light.
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#17191a' : '#ffffff');
      })();
    </script>
