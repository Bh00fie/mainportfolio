[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Keep Netlify on the same major as .nvmrc.
  NODE_VERSION = "24"

# Hashed assets are immutable; the HTML shell must not be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
